<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma liste de tâches</title>
</head>
<body>
    <h1>Mes tâches</h1>
    <ul>
        {% for tache in taches %}
            <li>
                {% if tache[2] %}
                    <s>{{ tache[1] }}</s>
                {% else %}
                    {{ tache[1] }}
                    <form action="/cocher/{{ tache[0] }}" method="POST" style="display:inline">
                        <button type="submit">Cocher</button>
                    </form>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
    <form action="/ajouter" method="POST">
        <input type="text" name="tache" placeholder="Nouvelle tâche" required>
        <button type="submit">Ajouter</button>
    </form>
</body>
</html>

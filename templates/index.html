<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma liste de tâches</title>
</head>
<body>
    <h1>Mes tâches</h1>
    <ul>
        {% for tache in taches %}
            <li>{{ tache[1] }}</li>
        {% endfor %}
    </ul>
     <form action="/ajouter" method="POST">
        <input type="text" name="tache" placeholder="Nouvelle tâche" required>
        <button type="submit">Ajouter</button>
    </form>
</body>
</html>
